services:
  gige-publisher:
    build:
      context: ..
      dockerfile: Academic_Immersion_Skoltech/docker/Dockerfile
      args:
        ROS_DISTRO: jazzy
        MVSDK_DIR: linuxSDK_V2.1.0.45(240521)
    image: gige-dev:jazzy
    container_name: gige-publisher
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./aida-camera:/work/Academic_Immersion_Skoltech/aida-camera
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    working_dir: /work/Academic_Immersion_Skoltech/aida-camera
    command: /usr/local/bin/start_camera.sh
    restart: unless-stopped
